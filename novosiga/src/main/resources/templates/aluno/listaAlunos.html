<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Alunos', 'aluno', 'Alunos', 'Cadastros', ~{::content}, ~{::extra})}">
<body>
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h2>Lista de alunos</h2>
            <p>Registros cadastrados no sistema.</p>
        </div>
        <a th:href="@{/aluno/criar}" class="btn btn-accent">Novo aluno</a>
    </div>

    <div class="panel">
        <div class="table-responsive">
            <table class="table data-table mb-0">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Curso</th>
                        <th>Endereço</th>
                        <th>Bairro</th>
                        <th>Cidade</th>
                        <th>UF</th>
                        <th>CEP</th>
                        <th>Telefone</th>
                        <th>CPF</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(alunos)}">
                        <td colspan="12">
                            <div class="empty-state">
                                <h3>Nenhum aluno cadastrado</h3>
                                <p>Inclua o primeiro registro para vê-lo nesta lista.</p>
                                <a th:href="@{/aluno/criar}" class="btn btn-accent">Cadastrar aluno</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="aluno : ${alunos}">
                        <td>
                            <img th:if="${aluno.fotoAluno != null}"
                                 th:src="@{/aluno/foto/{idAluno}(idAluno=${aluno.idAluno})}"
                                 alt="Foto do aluno" class="avatar">
                            <img th:if="${aluno.fotoAluno == null}"
                                 src="https://placehold.net/avatar.png"
                                 alt="Sem foto" class="avatar">
                        </td>
                        <td th:text="${aluno.idAluno}"></td>
                        <td th:text="${aluno.nomeAluno}"></td>
                        <td>
                            <span th:if="${aluno.curso != null}" class="rel-badge curso"
                                  th:text="${aluno.curso.nomeCurso}">Curso</span>
                            <span th:unless="${aluno.curso != null}" class="rel-badge is-empty">Sem curso</span>
                        </td>
                        <td th:text="${aluno.enderecoAluno}"></td>
                        <td th:text="${aluno.bairroAluno}"></td>
                        <td th:text="${aluno.cidadeAluno}"></td>
                        <td th:text="${aluno.estadoAluno}"></td>
                        <td th:text="${aluno.cepAluno}"></td>
                        <td th:text="${aluno.telefoneAluno}"></td>
                        <td th:text="${aluno.cpfAluno}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/aluno/editar/{id}(id=${aluno.idAluno})}" class="btn btn-sm btn-ghost">Editar</a>
                            <a th:href="@{/aluno/excluir/{id}(id=${aluno.idAluno})}"
                               class="btn btn-sm btn-danger-quiet"
                               onclick="return confirm('Deseja realmente excluir este aluno?');">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
<th:block th:fragment="extra"></th:block>
</body>
</html>
