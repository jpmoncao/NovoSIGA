<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário da Disciplina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Formulário da Disciplina</h1>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/disciplina/salvar}" th:object="${disciplina}" method="post">
                            <input type="hidden" th:field="*{idDisciplina}">

                            <div class="mb-3">
                                <label for="nomeDisciplina" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nomeDisciplina"
                                    th:field="*{nomeDisciplina}" maxlength="100" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="siglaDisciplina" class="form-label">Sigla</label>
                                    <input type="text" class="form-control" id="siglaDisciplina"
                                        th:field="*{siglaDisciplina}" maxlength="10" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="cargaHorariaDisciplina" class="form-label">Carga horária</label>
                                    <input type="number" class="form-control" id="cargaHorariaDisciplina"
                                        th:field="*{cargaHorariaDisciplina}" min="1" required>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Salvar</button>
                                <a th:href="@{/disciplina/listar}" class="btn btn-outline-secondary">Voltar à lista</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
