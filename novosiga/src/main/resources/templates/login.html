<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · NovoSIGA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}">
<style>
    .login-page { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #14181f 0%, #1d3a46 48%, #0f766e 100%); padding: 1.5rem; }
    .login-card { width: min(100%, 430px); border: 0; border-radius: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.28); overflow: hidden; }
    .login-brand { background: #14181f; color: #fff; padding: 2rem 2rem 1.5rem; }
    .login-mark { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: #0f766e; font-weight: 700; margin-bottom: 1rem; }
    .login-brand h1 { font-size: 1.7rem; margin: 0; }
    .login-brand p { color: #b8c4ce; margin: .45rem 0 0; }
    .login-form { padding: 2rem; }
    .login-form .form-control { padding: .75rem .85rem; border-radius: 10px; }
    .login-form .btn { padding: .75rem; border-radius: 10px; font-weight: 700; }
</style></head>
<body><main class="login-page"><section class="login-card bg-white">
<div class="login-brand"><span class="login-mark">NS</span><h1>NovoSIGA</h1><p>Gestão acadêmica</p></div>
<div class="login-form"><h2 class="h4 mb-1">Acesse sua conta</h2><p class="text-secondary mb-4">Entre para continuar no sistema.</p>
<div class="alert alert-danger" th:if="${param.error}">Usuário ou senha inválidos.</div>
<div class="alert alert-success" th:if="${param.logout}">Você saiu do sistema.</div>
<div class="alert alert-success" th:if="${param.cadastrado}">Cadastro concluído. Entre com sua conta.</div>
<form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label fw-semibold" for="username">Usuário</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
<div class="mb-4"><label class="form-label fw-semibold" for="password">Senha</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
<button class="btn btn-accent w-100" type="submit">Entrar</button></form>
<p class="text-center mt-4 mb-0 text-secondary">Ainda não tem conta? <a th:href="@{/usuarios/criar}" class="fw-semibold">Cadastre-se</a></p>
</div></section></main></body></html>
