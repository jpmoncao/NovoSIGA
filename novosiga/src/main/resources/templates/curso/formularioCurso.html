<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Formulário do curso', 'curso', 'Cursos', 'Cadastros / Cursos', ~{::content}, ~{::extra})}">
<body>
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h2 th:text="${curso.idCurso != null} ? 'Editar curso' : 'Novo curso'">Formulário do curso</h2>
            <p>Preencha os dados e salve para atualizar a lista.</p>
        </div>
        <a th:href="@{/curso/listar}" class="btn btn-ghost">Voltar à lista</a>
    </div>

    <div class="panel form-panel">
        <div class="panel-body">
            <form th:action="@{/curso/salvar}" th:object="${curso}" method="post">
                <input type="hidden" th:field="*{idCurso}">

                <div class="mb-3">
                    <label for="nomeCurso" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nomeCurso" th:field="*{nomeCurso}" maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="descricaoCurso" class="form-label">Descrição</label>
                    <textarea class="form-control" id="descricaoCurso" th:field="*{descricaoCurso}" maxlength="200" rows="3" required></textarea>
                </div>

                <div class="mb-4">
                    <label for="cargaHorariaCurso" class="form-label">Carga horária</label>
                    <input type="number" class="form-control" id="cargaHorariaCurso" th:field="*{cargaHorariaCurso}" min="1" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent">Salvar</button>
                    <a th:href="@{/curso/listar}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</th:block>
<th:block th:fragment="extra"></th:block>
</body>
</html>
