<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Formulário do professor', 'professor', 'Professores', 'Cadastros / Professores', ~{::content}, ~{::extra})}">
<body>
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h2 th:text="${professor.idProfessor != null} ? 'Editar professor' : 'Novo professor'">Formulário do professor</h2>
            <p>Preencha os dados e salve para atualizar a lista.</p>
        </div>
        <a th:href="@{/professor/listar}" class="btn btn-ghost">Voltar à lista</a>
    </div>

    <div class="panel form-panel">
        <div class="panel-body">
            <form th:action="@{/professor/salvar}" th:object="${professor}" method="post">
                <input type="hidden" th:field="*{idProfessor}">

                <div class="mb-3">
                    <label for="nomeProfessor" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nomeProfessor" th:field="*{nomeProfessor}" maxlength="50" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="cpfProfessor" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpfProfessor" th:field="*{cpfProfessor}" maxlength="11" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="rgProfessor" class="form-label">RG</label>
                        <input type="text" class="form-control" id="rgProfessor" th:field="*{rgProfessor}" maxlength="11" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="telefoneProfessor" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefoneProfessor" th:field="*{telefoneProfessor}" maxlength="11" required>
                </div>

                <div class="mb-3">
                    <label for="enderecoProfessor" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="enderecoProfessor" th:field="*{enderecoProfessor}" maxlength="100" required>
                </div>

                <div class="mb-4">
                    <label for="graduacaoProfessor" class="form-label">Graduação</label>
                    <input type="text" class="form-control" id="graduacaoProfessor" th:field="*{graduacaoProfessor}" maxlength="100" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent">Salvar</button>
                    <a th:href="@{/professor/listar}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</th:block>
<th:block th:fragment="extra"></th:block>
</body>
</html>
