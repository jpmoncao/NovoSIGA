<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro · NovoSIGA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><main class="container py-5" style="max-width:560px"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Criar conta</h1><div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
<form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
<div class="mb-3"><label class="form-label" for="nomeUsuario">Nome</label><input class="form-control" id="nomeUsuario" th:field="*{nomeUsuario}" maxlength="40" required></div>
<div class="mb-3"><label class="form-label" for="cpfUsuario">CPF (11 dígitos)</label><input class="form-control" id="cpfUsuario" th:field="*{cpfUsuario}" pattern="[0-9]{11}" maxlength="11" required></div>
<div class="mb-3"><label class="form-label" for="loginUsuario">Login</label><input class="form-control" id="loginUsuario" th:field="*{loginUsuario}" maxlength="30" autocomplete="username" required></div>
<div class="mb-3"><label class="form-label" for="senhaUsuario">Senha</label><input class="form-control" type="password" id="senhaUsuario" th:field="*{senhaUsuario}" autocomplete="new-password" required></div>
<button class="btn btn-primary" type="submit">Criar conta</button> <a class="btn btn-link" th:href="@{/login}">Voltar ao login</a>
</form></div></div></main></body></html>
