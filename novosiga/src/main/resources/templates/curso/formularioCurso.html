<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário do Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Formulário do Curso</h1>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/curso/salvar}" th:object="${curso}" method="post">
                            <input type="hidden" th:field="*{idCurso}">

                            <div class="mb-3">
                                <label for="nomeCurso" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nomeCurso" th:field="*{nomeCurso}"
                                    maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label for="descricaoCurso" class="form-label">Descrição</label>
                                <textarea class="form-control" id="descricaoCurso" th:field="*{descricaoCurso}"
                                    maxlength="200" rows="3" required></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="cargaHorariaCurso" class="form-label">Carga horária</label>
                                <input type="number" class="form-control" id="cargaHorariaCurso"
                                    th:field="*{cargaHorariaCurso}" min="1" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Salvar</button>
                                <a th:href="@{/curso/listar}" class="btn btn-outline-secondary">Voltar à lista</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
