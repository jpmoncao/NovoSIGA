<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro · NovoSIGA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}">
<style>
.signup-page{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#14181f 0%,#1d3a46 48%,#0f766e 100%);padding:1.5rem}.signup-card{width:min(100%,560px);border:0;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden}.signup-brand{background:#14181f;color:#fff;padding:1.6rem 2rem}.signup-mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#0f766e;font-weight:700;margin-bottom:.8rem}.signup-brand h1{font-size:1.5rem;margin:0}.signup-brand p{color:#b8c4ce;margin:.35rem 0 0}.signup-form{padding:2rem}.signup-form .form-control{padding:.7rem .85rem;border-radius:10px}.signup-form .btn{padding:.7rem 1rem;border-radius:10px;font-weight:700}
</style></head>
<body><main class="signup-page"><section class="signup-card bg-white"><div class="signup-brand"><span class="signup-mark">NS</span><h1>Criar conta no NovoSIGA</h1><p>Preencha seus dados para acessar a gestão acadêmica.</p></div><div class="signup-form">
<div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
<form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
<div class="mb-3"><label class="form-label fw-semibold" for="nomeUsuario">Nome completo</label><input class="form-control" id="nomeUsuario" th:field="*{nomeUsuario}" maxlength="40" autocomplete="name" required></div>
<div class="mb-3"><label class="form-label fw-semibold" for="cpfUsuario">CPF</label><input class="form-control" id="cpfUsuario" th:field="*{cpfUsuario}" pattern="[0-9]{11}" maxlength="11" inputmode="numeric" placeholder="Somente números" required></div>
<div class="mb-3"><label class="form-label fw-semibold" for="loginUsuario">Usuário</label><input class="form-control" id="loginUsuario" th:field="*{loginUsuario}" maxlength="30" autocomplete="username" required></div>
<div class="mb-4"><label class="form-label fw-semibold" for="senhaUsuario">Senha</label><input class="form-control" type="password" id="senhaUsuario" th:field="*{senhaUsuario}" autocomplete="new-password" required></div>
<button class="btn btn-accent w-100" type="submit">Criar conta</button></form><p class="text-center mt-4 mb-0 text-secondary">Já possui uma conta? <a th:href="@{/login}" class="fw-semibold">Entrar</a></p>
</div></section></main></body></html>
