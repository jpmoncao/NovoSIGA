<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Formulário do Professor</h1>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/professor/salvar}" th:object="${professor}" method="post">
                            <input type="hidden" th:field="*{idProfessor}">

                            <div class="mb-3">
                                <label for="nomeProfessor" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nomeProfessor" th:field="*{nomeProfessor}"
                                    maxlength="50" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="cpfProfessor" class="form-label">CPF</label>
                                    <input type="text" class="form-control" id="cpfProfessor"
                                        th:field="*{cpfProfessor}" maxlength="11" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="rgProfessor" class="form-label">RG</label>
                                    <input type="text" class="form-control" id="rgProfessor" th:field="*{rgProfessor}"
                                        maxlength="11" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="telefoneProfessor" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="telefoneProfessor"
                                    th:field="*{telefoneProfessor}" maxlength="11" required>
                            </div>

                            <div class="mb-3">
                                <label for="enderecoProfessor" class="form-label">Endereço</label>
                                <input type="text" class="form-control" id="enderecoProfessor"
                                    th:field="*{enderecoProfessor}" maxlength="100" required>
                            </div>

                            <div class="mb-4">
                                <label for="graduacaoProfessor" class="form-label">Graduação</label>
                                <input type="text" class="form-control" id="graduacaoProfessor"
                                    th:field="*{graduacaoProfessor}" maxlength="100" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Salvar</button>
                                <a th:href="@{/professor/listar}" class="btn btn-outline-secondary">Voltar à lista</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
