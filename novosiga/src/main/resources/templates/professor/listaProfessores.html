<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Professores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Lista de Professores</h1>
            <a th:href="@{/professor/criar}" class="btn btn-primary">Novo professor</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>RG</th>
                                <th>Telefone</th>
                                <th>Endereço</th>
                                <th>Graduação</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(professores)}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    Nenhum professor cadastrado.
                                </td>
                            </tr>
                            <tr th:each="professor : ${professores}">
                                <td th:text="${professor.idProfessor}"></td>
                                <td th:text="${professor.nomeProfessor}"></td>
                                <td th:text="${professor.cpfProfessor}"></td>
                                <td th:text="${professor.rgProfessor}"></td>
                                <td th:text="${professor.telefoneProfessor}"></td>
                                <td th:text="${professor.enderecoProfessor}"></td>
                                <td th:text="${professor.graduacaoProfessor}"></td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{/professor/editar/{id}(id=${professor.idProfessor})}"
                                        class="btn btn-sm btn-outline-primary">Editar</a>
                                    <a th:href="@{/professor/excluir/{id}(id=${professor.idProfessor})}"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deseja realmente excluir este professor?');">Excluir</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
