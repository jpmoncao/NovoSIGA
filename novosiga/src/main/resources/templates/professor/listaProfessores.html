<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Professores', 'professor', 'Professores', 'Cadastros', ~{::content}, ~{::extra})}">
<body>
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h2>Lista de professores</h2>
            <p>Registros cadastrados no sistema.</p>
        </div>
        <a th:href="@{/professor/criar}" class="btn btn-accent">Novo professor</a>
    </div>

    <div class="panel">
        <div class="table-responsive">
            <table class="table data-table mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>RG</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th>Graduação</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(professores)}">
                        <td colspan="8">
                            <div class="empty-state">
                                <h3>Nenhum professor cadastrado</h3>
                                <p>Inclua o primeiro registro para vê-lo nesta lista.</p>
                                <a th:href="@{/professor/criar}" class="btn btn-accent">Cadastrar professor</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="professor : ${professores}">
                        <td th:text="${professor.idProfessor}"></td>
                        <td th:text="${professor.nomeProfessor}"></td>
                        <td th:text="${professor.cpfProfessor}"></td>
                        <td th:text="${professor.rgProfessor}"></td>
                        <td th:text="${professor.telefoneProfessor}"></td>
                        <td th:text="${professor.enderecoProfessor}"></td>
                        <td th:text="${professor.graduacaoProfessor}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/professor/editar/{id}(id=${professor.idProfessor})}" class="btn btn-sm btn-ghost">Editar</a>
                            <a th:href="@{/professor/excluir/{id}(id=${professor.idProfessor})}"
                               class="btn btn-sm btn-danger-quiet"
                               onclick="return confirm('Deseja realmente excluir este professor?');">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
<th:block th:fragment="extra"></th:block>
</body>
</html>
