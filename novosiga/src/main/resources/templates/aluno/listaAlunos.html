<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Lista de Alunos</h1>
            <a th:href="@{/aluno/criar}" class="btn btn-primary">Novo aluno</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>Foto</th>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Endereço</th>
                                <th>Bairro</th>
                                <th>Cidade</th>
                                <th>UF</th>
                                <th>CEP</th>
                                <th>Telefone</th>
                                <th>CPF</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(alunos)}">
                                <td colspan="10" class="text-center text-muted py-4">
                                    Nenhum aluno cadastrado.
                                </td>
                            </tr>
                            <tr th:each="aluno : ${alunos}">
                                <td width="120px" height="72px" class="text-center">
                                    <img th:if="${aluno.fotoAluno != null}"
                                        th:src="@{/aluno/foto/{idAluno}(idAluno=${aluno.idAluno})}" alt="Foto do Aluno"
                                        class="img-fluid rounded-circle"
                                        style="width: 72px; height: 72px; aspect-ratio: 1/1; object-fit: cover;">
                                    <img th:if="${aluno.fotoAluno == null}" src="https://placehold.net/avatar.png"
                                        alt="Foto do Aluno" class="img-fluid rounded-circle"
                                        style="width: 72px; height: 72px; aspect-ratio: 1/1; object-fit: cover;">
                                </td>
                                <td th:text="${aluno.idAluno}"></td>
                                <td th:text="${aluno.nomeAluno}"></td>
                                <td th:text="${aluno.enderecoAluno}"></td>
                                <td th:text="${aluno.bairroAluno}"></td>
                                <td th:text="${aluno.cidadeAluno}"></td>
                                <td th:text="${aluno.estadoAluno}"></td>
                                <td th:text="${aluno.cepAluno}"></td>
                                <td th:text="${aluno.telefoneAluno}"></td>
                                <td th:text="${aluno.cpfAluno}"></td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{/aluno/editar/{id}(id=${aluno.idAluno})}"
                                        class="btn btn-sm btn-outline-primary">Editar</a>
                                    <a th:href="@{/aluno/excluir/{id}(id=${aluno.idAluno})}"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deseja realmente excluir este aluno?');">Excluir</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
