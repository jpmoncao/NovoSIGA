<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout('Formulário da disciplina', 'disciplina', 'Disciplinas', 'Cadastros / Disciplinas', ~{::content}, ~{::extra})}">

<body>
    <th:block th:fragment="content">
        <div class="page-head">
            <div>
                <h2 th:text="${disciplina.idDisciplina != null} ? 'Editar disciplina' : 'Nova disciplina'">Formulário da
                    disciplina</h2>
                <p>Preencha os dados e salve para atualizar a lista.</p>
            </div>
            <a th:href="@{/disciplina/listar}" class="btn btn-ghost">Voltar à lista</a>
        </div>

        <div class="panel form-panel">
            <div class="panel-body">
                <form th:action="@{/disciplina/salvar}" th:object="${disciplina}" method="post">
                    <input type="hidden" th:field="*{idDisciplina}">

                    <div class="mb-3">
                        <label for="nomeDisciplina" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nomeDisciplina" th:field="*{nomeDisciplina}"
                            maxlength="100" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="siglaDisciplina" class="form-label">Sigla</label>
                            <input type="text" class="form-control" id="siglaDisciplina" th:field="*{siglaDisciplina}"
                                maxlength="10" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cargaHorariaDisciplina" class="form-label">Carga horária</label>
                            <input type="number" class="form-control" id="cargaHorariaDisciplina"
                                th:field="*{cargaHorariaDisciplina}" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="idProfessor" class="form-label">Professor</label>
                            <select class="form-select" id="idProfessor" th:field="*{professor.idProfessor}" required>
                                <option value="">Selecione o professor</option>
                                <option th:each="professor : ${professores}"
                                        th:value="${professor.idProfessor}"
                                        th:text="${professor.nomeProfessor}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="idCurso" class="form-label">Curso</label>
                            <select class="form-select" id="idCurso" th:field="*{curso.idCurso}" required>
                                <option value="">Selecione o curso</option>
                                <option th:each="curso : ${cursos}"
                                        th:value="${curso.idCurso}"
                                        th:text="${curso.nomeCurso}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent">Salvar</button>
                        <a th:href="@{/disciplina/listar}" class="btn btn-ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
    <th:block th:fragment="extra"></th:block>
</body>

</html>
