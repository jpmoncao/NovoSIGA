<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · NovoSIGA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="bg-light"><main class="container py-5" style="max-width:460px"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Entrar no NovoSIGA</h1>
<div class="alert alert-danger" th:if="${param.error}">Usuário ou senha inválidos.</div>
<div class="alert alert-success" th:if="${param.logout}">Você saiu do sistema.</div>
<div class="alert alert-success" th:if="${param.cadastrado}">Cadastro concluído. Entre com sua conta.</div>
<form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label" for="username">Usuário</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
<div class="mb-3"><label class="form-label" for="password">Senha</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
<button class="btn btn-primary w-100" type="submit">Entrar</button></form>
<p class="mt-3 mb-0">Ainda não tem conta? <a th:href="@{/usuarios/criar}">Cadastre-se</a></p>
</div></div></main></body></html>
