<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Disciplinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Lista de Disciplinas</h1>
            <a th:href="@{/disciplina/criar}" class="btn btn-primary">Nova disciplina</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Sigla</th>
                                <th>Carga horária</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(disciplinas)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    Nenhuma disciplina cadastrada.
                                </td>
                            </tr>
                            <tr th:each="disciplina : ${disciplinas}">
                                <td th:text="${disciplina.idDisciplina}"></td>
                                <td th:text="${disciplina.nomeDisciplina}"></td>
                                <td th:text="${disciplina.siglaDisciplina}"></td>
                                <td th:text="${disciplina.cargaHorariaDisciplina}"></td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{/disciplina/editar/{id}(id=${disciplina.idDisciplina})}"
                                        class="btn btn-sm btn-outline-primary">Editar</a>
                                    <a th:href="@{/disciplina/excluir/{id}(id=${disciplina.idDisciplina})}"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deseja realmente excluir esta disciplina?');">Excluir</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
