<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Cursos', 'curso', 'Cursos', 'Cadastros', ~{::content}, ~{::extra})}">
<body>
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h2>Lista de cursos</h2>
            <p>Registros cadastrados no sistema.</p>
        </div>
        <a th:href="@{/curso/criar}" class="btn btn-accent">Novo curso</a>
    </div>

    <div class="panel">
        <div class="table-responsive">
            <table class="table data-table mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Carga horária</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(cursos)}">
                        <td colspan="5">
                            <div class="empty-state">
                                <h3>Nenhum curso cadastrado</h3>
                                <p>Inclua o primeiro registro para vê-lo nesta lista.</p>
                                <a th:href="@{/curso/criar}" class="btn btn-accent">Cadastrar curso</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="curso : ${cursos}">
                        <td th:text="${curso.idCurso}"></td>
                        <td th:text="${curso.nomeCurso}"></td>
                        <td th:text="${curso.descricaoCurso}"></td>
                        <td th:text="${curso.cargaHorariaCurso}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/curso/editar/{id}(id=${curso.idCurso})}" class="btn btn-sm btn-ghost">Editar</a>
                            <a th:href="@{/curso/excluir/{id}(id=${curso.idCurso})}"
                               class="btn btn-sm btn-danger-quiet"
                               onclick="return confirm('Deseja realmente excluir este curso?');">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
<th:block th:fragment="extra"></th:block>
</body>
</html>
