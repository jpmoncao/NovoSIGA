<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Disciplinas', 'disciplina', 'Disciplinas', 'Cadastros', ~{::content}, ~{::extra})}">
<body>
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h2>Lista de disciplinas</h2>
            <p>Registros cadastrados no sistema.</p>
        </div>
        <a th:href="@{/disciplina/criar}" class="btn btn-accent">Nova disciplina</a>
    </div>

    <div class="panel">
        <div class="table-responsive">
            <table class="table data-table mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Sigla</th>
                        <th>Professor</th>
                        <th>Curso</th>
                        <th>Carga horária</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(disciplinas)}">
                        <td colspan="7">
                            <div class="empty-state">
                                <h3>Nenhuma disciplina cadastrada</h3>
                                <p>Inclua o primeiro registro para vê-lo nesta lista.</p>
                                <a th:href="@{/disciplina/criar}" class="btn btn-accent">Cadastrar disciplina</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="disciplina : ${disciplinas}">
                        <td th:text="${disciplina.idDisciplina}"></td>
                        <td th:text="${disciplina.nomeDisciplina}"></td>
                        <td th:text="${disciplina.siglaDisciplina}"></td>
                        <td>
                            <span th:if="${disciplina.professor != null}" class="rel-badge professor"
                                  th:text="${disciplina.professor.nomeProfessor}">Professor</span>
                            <span th:unless="${disciplina.professor != null}" class="rel-badge is-empty">Sem professor</span>
                        </td>
                        <td>
                            <span th:if="${disciplina.curso != null}" class="rel-badge curso"
                                  th:text="${disciplina.curso.nomeCurso}">Curso</span>
                            <span th:unless="${disciplina.curso != null}" class="rel-badge is-empty">Sem curso</span>
                        </td>
                        <td th:text="${disciplina.cargaHorariaDisciplina}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/disciplina/editar/{id}(id=${disciplina.idDisciplina})}" class="btn btn-sm btn-ghost">Editar</a>
                            <a th:href="@{/disciplina/excluir/{id}(id=${disciplina.idDisciplina})}"
                               class="btn btn-sm btn-danger-quiet"
                               onclick="return confirm('Deseja realmente excluir esta disciplina?');">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
<th:block th:fragment="extra"></th:block>
</body>
</html>
