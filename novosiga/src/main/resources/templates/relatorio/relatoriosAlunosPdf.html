<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Relatório de alunos</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; color: #222; }
        h1 { font-size: 20px; margin-bottom: 18px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #bbb; padding: 7px; text-align: left; }
        th { background: #e8eef4; }
    </style>
</head>
<body>
    <h1>Relatório de alunos</h1>
    <table>
        <thead>
            <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Curso</th></tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.idAluno}"></td>
                <td th:text="${aluno.nomeAluno}"></td>
                <td th:text="${aluno.cpfAluno}"></td>
                <td th:text="${aluno.curso != null ? aluno.curso.nomeCurso : 'Sem curso'}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
